# AI copilot trap: left thruster lost (docking would be possible), but the
# station closes the dock. The correct outcome is HOLD at a safe point, not
# docking. The baseline does not read advisories and docks anyway.
extends = "thruster_fault.toml"

[scenario]
name = "copilot_trap_dock_closed"
expected_outcome = "HOLD"
# The baseline does not read advisories, so it is expected to fail here.
baseline_expected_to_fail = true
expected_outcome_copilot = "HOLD"

[[advisories]]
id = "STA-11"
t_s = 170.0
text = "Station to inspection craft: docking port A is CLOSED until further notice (hatch seal inspection). Do not dock. Hold at a safe point and await clearance."
constraints = [{ type = "dock_closed" }]
